# ============================================================
# Sarthi - Docker Compose (Local Development)
# Spins up backend, frontend, and MongoDB together
# ============================================================

version: "3.9"

services:
  # ---- MongoDB ----
  mongodb:
    image: mongo:7
    container_name: sarthi-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  # ---- Backend (FastAPI) ----
  backend:
    build:
      context: ./backend
    container_name: sarthi-backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
    restart: unless-stopped

  # ---- Frontend (Next.js) ----
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:8080"
    container_name: sarthi-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data:
    driver: local
