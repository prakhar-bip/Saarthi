version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: sarthi-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - sarthi-network

  redis:
    image: redis:alpine
    container_name: sarthi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - sarthi-network

  backend:
    build: .
    container_name: sarthi-backend
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET=sarthi-jwt-super-secret-key-2026
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - MONGODB_URI=mongodb://mongodb:27017
      - DATABASE_NAME=sarthi
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_MODEL=${GOOGLE_MODEL:-gemini-3-pro-preview}
      - GOOGLE_FAST_MODEL=${GOOGLE_FAST_MODEL:-gemini-3-flash-preview}
      - GOOGLE_REASONING_MODEL=${GOOGLE_REASONING_MODEL:-gemini-3-pro-preview}
      - PARTNER_TRACK=MongoDB
      - PARTNER_MCP_SERVER=mongodb-mcp-server@latest
      - MONGODB_MCP_ENABLED=true
      - MONGODB_MCP_READ_ONLY=true
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_BASE_URL=${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - NVIDIA_MODEL=${NVIDIA_MODEL:-openai/gpt-oss-20b}
    depends_on:
      - mongodb
      - redis
    networks:
      - sarthi-network

networks:
  sarthi-network:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
